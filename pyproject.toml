[project]
name = "langgraph-klaim-lab"
version = "0.1.0"
description = "Lab LangGraph dari nol: agent klaim reimbursement karyawan (router, paralel, Send, evaluator-optimizer, human-in-the-loop, checkpoint, Studio)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Versi dikunci supaya perilaku lab sama dengan yang sudah dites.
dependencies = [
    "langgraph==1.2.18",
    "langgraph-checkpoint==4.3.1",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langchain-core==1.7.1",
    "langchain-openai==1.7.3",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "langgraph-cli[inmem]==0.4.43",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
