[project]
name = "langgraph-claim-lab"
version = "0.2.0"
description = "LangGraph from scratch, step by step: an employee reimbursement claim agent (supersteps, parallel branches, Send, ChromaDB RAG, evaluator-optimizer, human-in-the-loop, checkpoints, Studio)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Versions are pinned so the lab behaves exactly as tested.
dependencies = [
    "langgraph==1.2.18",
    "langgraph-checkpoint==4.3.1",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langchain-core==1.7.1",
    "langchain-openai==1.7.3",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "chromadb==1.5.9",
    "scikit-learn==1.9.1",
    "fastembed==0.9.1",
    "grandalf==0.8",
    "pytest==9.2.0",
    "mcp==2.3.0",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]==0.4.43",
]

[tool.uv]
# This project is not an installable library; just run the files directly:
#   uv run app.py "Process claim CLM-002"
#   uv run pytest tests/test_step01.py
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
